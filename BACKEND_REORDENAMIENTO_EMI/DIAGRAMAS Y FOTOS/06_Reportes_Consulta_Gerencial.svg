size="18" font-weight="700" lengthAdjust="spacing" textLength="319.0693" x="31" y="288.73">== REPORTES ESTRUCTURADOS ==</text><rect fill="#FFFFFF" height="74" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="286.1504" x="47.4595" y="337.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="261.1582" x="57.4595" y="361.73">Elige: Inventario por Laboratorio,</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="266.1504" x="57.4595" y="379.73">Reporte por Unidad Academica o</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="204.1084" x="57.4595" y="397.73">Comparativa entre Sedes</text><rect fill="#FFFFFF" height="38" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="320.1729" x="30.4482" y="537.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="300.1729" x="40.4482" y="561.73">Visualiza tablas y graficos en pantalla</text><rect fill="#FFFFFF" height="38" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="351.0488" x="525.9053" y="223.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" font-weight="700" lengthAdjust="spacing" textLength="331.0488" x="535.9053" y="247.73">== CONSULTA GERENCIAL CON IA ==</text><rect fill="#FFFFFF" height="74" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="349.2383" x="526.8105" y="296.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="329.2383" x="536.8105" y="320.73">Escribe una pregunta en lenguaje natural</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="319.5879" x="536.8105" y="338.73">(ej: "cuantos equipos en mal estado hay</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="154.4854" x="536.8105" y="356.73">en Cochabamba?")</text><rect fill="#FFFFFF" height="38" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="238.1533" x="582.353" y="578.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="218.1533" x="592.353" y="602.73">Lee la respuesta redactada</text><line style="stroke:#000000;stroke-width:1.5;" x1="190.5347" x2="701.4297" y1="636.8696" y2="636.8696"/><rect fill="#FFFFFF" height="56" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="299.1406" x="370.0693" y="656.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="279.1406" x="380.0693" y="680.73">Usa la informacion para la toma de</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="184.1045" x="380.0693" y="698.73">decisiones institucional</text><ellipse cx="519.6396" cy="743.8696" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="519.6396" cy="743.8696" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="15" x2="15" y1="81.8696" y2="754.8696"/><rect fill="#FFF3E0" height="673" style="stroke:#FFF3E0;stroke-width:1;" width="347.1885" x="880.9541" y="81.8696"/><rect fill="#FFFFFF" height="56" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="337.1885" x="886.9541" y="446.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="317.1885" x="896.9541" y="470.73">Consolida los datos (equipos, deterioro,</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="294.1348" x="896.9541" y="488.73">laboratorios, guias) y arma el reporte</text><line style="stroke:#000000;stroke-width:1;" x1="880.9541" x2="880.9541" y1="81.8696" y2="754.8696"/><rect fill="#FFF3E0" height="673" style="stroke:#FFF3E0;stroke-width:1;" width="717.3672" x="1228.1426" y="81.8696"/><polygon fill="#FFFFFF" points="1440.9829,405.8696,1731.1802,405.8696,1743.1802,417.8696,1731.1802,429.8696,1440.9829,429.8696,1428.9829,417.8696,1440.9829,405.8696" style="stroke:#000000;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="290.1973" x="1440.9829" y="422.73">La pregunta pide datos del sistema?</text><text fill="#000000" font-family="'Helvetica'" font-size="16" font-weight="700" lengthAdjust="spacing" textLength="15.1172" x="1413.8657" y="414.1899">SI</text><text fill="#000000" font-family="'Helvetica'" font-size="16" lengthAdjust="spacing" textLength="127.1797" x="1743.1802" y="414.1899">Es saludo / charla</text><rect fill="#FFFFFF" height="74" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="340.1943" x="1234.1426" y="439.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="300.1729" x="1244.1426" y="463.73">Detecta el tipo de consulta, extrae los</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="320.1943" x="1244.1426" y="481.73">datos reales de la base de datos y arma</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="247.1221" x="1244.1426" y="499.73">la respuesta con cifras exactas</text><rect fill="#FFFFFF" height="56" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="347.1729" x="1594.3369" y="439.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="327.1729" x="1604.3369" y="463.73">Responde cordialmente SIN volcar datos</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="91.0371" x="1604.3369" y="481.73">del sistema</text><polygon fill="#FFFFFF" points="1586.0815,519.8696,1598.0815,531.8696,1586.0815,543.8696,1574.0815,531.8696,1586.0815,519.8696" style="stroke:#000000;st