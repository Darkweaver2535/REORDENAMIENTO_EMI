<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="777px" preserveAspectRatio="none" style="width:1450px;height:777px;background:#F9F8F5;" version="1.1" viewBox="0 0 1450 777" width="1450px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><rect fill="#F9F8F5" height="777" style="stroke:none;stroke-width:1;" width="1450" x="0" y="0"/><g class="title" data-source-line="31"><text fill="#000000" font-family="'Helvetica'" font-size="24" font-weight="700" lengthAdjust="spacing" textLength="546.75" x="451.0915" y="33.4805">Sistema de Gestion de Laboratorios (SGL) - EMI</text><text fill="#000000" font-family="'Helvetica'" font-size="24" font-weight="700" lengthAdjust="spacing" textLength="620.2266" x="414.3532" y="57.4805">Mapa de Actores (Usuarios) y su Alcance de Permisos</text></g><!--entity SA--><g class="entity" data-qualified-name="SA" data-source-line="33" id="ent0001"><rect fill="#C62828" height="162" rx="7" ry="7" style="stroke:#000000;stroke-width:2;" width="301.2598" x="604.78" y="81"/><text fill="#000000" font-family="'Helvetica'" font-size="20" font-weight="700" lengthAdjust="spacing" textLength="140.0098" x="614.78" y="106.4004">SUPER ADMIN</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="235.6641" x="614.78" y="126.4004">(Superusuario Django / TI)</text><text fill="#000000" font-family="'Helvetica'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="6.1123" x="614.78" y="147.9404">&#160;</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="246.748" x="614.78" y="168.4004">Control TOTAL del sistema.</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="267.9297" x="614.78" y="188.4004">Crea la 1ra cuenta, respaldos,</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="247.9395" x="614.78" y="208.4004">configuracion tecnica, panel</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="281.2598" x="614.78" y="228.4004">/admin de Django, migraciones.</text></g><!--entity ADM--><g class="entity" data-qualified-name="ADM" data-source-line="35" id="ent0002"><rect fill="#1565C0" height="148" rx="7" ry="7" style="stroke:#000000;stroke-width:2;" width="352.3047" x="579.26" y="325"/><text fill="#000000" font-family="'Helvetica'" font-size="20" font-weight="700" lengthAdjust="spacing" textLength="169.9902" x="589.26" y="350.4004">ADMINISTRADOR</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="332.3047" x="589.26" y="370.4004">(Administrativo Institucional - ADMIN)</text><line style="stroke:#000000;stroke-width:1;" x1="580.26" x2="930.5647" y1="375" y2="375"/><line style="stroke:#000000;stroke-width:1;" x1="580.26" x2="930.5647" y1="377" y2="377"/><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="325.6836" x="589.26" y="394.4004">Vision NACIONAL (todas las sedes).</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="296.8359" x="589.26" y="414.4004">Gestiona usuarios, configuracion,</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="261.2695" x="589.26" y="434.4004">aprueba guias y traslados, ve</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="284.5996" x="589.26" y="454.4004">auditoria y reportes gerenciales.</text></g><!--entity JEFE--><g class="entity" data-qualified-name="JEFE" data-source-line="37" id="ent0003"><rect fill="#2E7D32" height="148" rx="7" ry="7" style="stroke:#000000;stroke-width:2;" width="326.8262" x="12" y="534"/><text fill="#000000" font-family="'Helvetica'" font-size="20" font-weight="700" lengthAdjust="spacing" textLength="188.916" x="22" y="559.4004">JEFE DE CARRERA</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="62.2168" x="22" y="579.4004">(JEFE)</text><line style="stroke:#000000;stroke-width:1;" x1="13" x2="337.8262" y1="584" y2="584"/><line style="stroke:#000000;stroke-width:1;" x1="13" x2="337.8262" y1="586" y2="586"/><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="270.1074" x="22" y="603.4004">Vision NACIONAL academica.</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="283.4961" x="22" y="623.4004">Crea/aprueba guias y traslados,</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="306.8262" x="22" y="643.4004">ve reportes, comparativa de sedes</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="296.8359" x="22" y="663.4004">y auditoria. No gestiona usuarios.</text></g><!--entity ENC--><g class="entity" data-qualified-name="ENC" data-source-line="39" id="ent0004"><rect fill="#EF6C00" height="148" rx="7" ry="7" style="stroke:#000000;stroke-width:2;" width="391.1621" x="373.83" y="534"/><text fill="#000000" font-family="'Helvetica'" font-size="20" font-weight="700" lengthAdjust="spacing" textLength="258.9063" x="383.83" y="559.4004">ENCARGADO DE ACTIVOS</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="371.1621" x="383.83" y="579.4004">(ENCARGADO_ACTIVOS - Activos Fijos)</text><line style="stroke:#000000;stroke-width:1;" x1="374.83" x2="763.9921" y1="584" y2="584"/><line style="stroke:#000000;stroke-width:1;" x1="374.83" x2="763.9921" y1="586" y2="586"/><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="231.2305" x="383.83" y="603.4004">Vision SOLO de SU sede.</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="280.1563" x="383.83" y="623.4004">Inventario, evaluaciones in-situ,</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="276.8164" x="383.83" y="643.4004">mantenimientos y recepcion de</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="293.4863" x="383.83" y="663.4004">traslados. NO aprueba traslados.</text></g><!--entity DOC--><g class="entity" data-qualified-name="DOC" data-source-line="41" id="ent0005"><rect fill="#6A1B9A" height="128" rx="7" ry="7" style="stroke:#000000;stroke-width:2;" width="283.4668" x="799.68" y="544"/><text fill="#000000" font-family="'Helvetica'" font-size="20" font-weight="700" lengthAdjust="spacing" textLength="97.7832" x="809.68" y="569.4004">DOCENTE</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="111.1035" x="809.68" y="589.4004">(DOCENTE)</text><line style="stroke:#000000;stroke-width:1;" x1="800.68" x2="1082.1468" y1="594" y2="594"/><line style="stroke:#000000;stroke-width:1;" x1="800.68" x2="1082.1468" y1="596" y2="596"/><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="249.043" x="809.68" y="613.4004">Consulta guias publicadas y</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="263.4668" x="809.68" y="633.4004">programa de practicas de sus</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="108.9551" x="809.68" y="653.4004">asignaturas.</text></g><!--entity EST--><g class="entity" data-qualified-name="EST" data-source-line="43" id="ent0006"><rect fill="#00838F" height="108" rx="7" ry="7" style="stroke:#000000;stroke-width:2;" width="319.043" x="1117.89" y="554"/><text fill="#000000" font-family="'Helvetica'" font-size="20" font-weight="700" lengthAdjust="spacing" textLength="127.7832" x="1127.89" y="579.4004">ESTUDIANTE</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="140" x="1127.89" y="599.4004">(ESTUDIANTE)</text><line style="stroke:#000000;stroke-width:1;" x1="1118.89" x2="1435.933" y1="604" y2="604"/><line style="stroke:#000000;stroke-width:1;" x1="1118.89" x2="1435.933" y1="606" y2="606"/><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="291.2793" x="1127.89" y="623.4004">Consulta y descarga unicamente</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="299.043" x="1127.89" y="643.4004">las guias en estado PUBLICADO.</text></g><!--link SA to ADM--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="45" id="lnk7"><path d="M755.41,243.22 C755.41,269.68 755.41,293.95 755.41,319.85" fill="none" id="SA-to-ADM" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="755.41,324.85,759.41,315.85,755.41,319.85,751.41,315.85,755.41,324.85" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="167.8613" x="756.41" y="289.4004">crea y asigna roles</text></g><!--link ADM to JEFE--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="46" id="lnk8"><path d="M578.84,456.8 C509.21,479.85 428.73,507.3 356.41,534 C350.69,536.11 349.5557,536.5187 343.6957,538.7387" fill="none" id="ADM-to-JEFE" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="339.02,540.51,348.8534,541.0621,343.6957,538.7387,346.0192,533.581,339.02,540.51" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link ADM to ENC--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency