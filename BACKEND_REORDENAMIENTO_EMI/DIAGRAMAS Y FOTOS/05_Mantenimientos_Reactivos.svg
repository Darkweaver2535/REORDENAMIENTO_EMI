 height="56" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="407.1934" x="21" y="299.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="59.0361" x="31" y="323.73">Elige el</text><text fill="#000000" font-family="'Helvetica'" font-size="18" font-weight="700" lengthAdjust="spacing" textLength="32.9854" x="95.0371" y="323.73">tipo</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="192.0674" x="128.0225" y="323.73">: Preventivo, Correctivo,</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="387.1934" x="31" y="341.73">Limpieza, Reparacion, Calibracion o Verificacion</text><rect fill="#FFFFFF" height="56" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="353.7207" x="47.7363" y="390.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="71.042" x="57.7363" y="414.73">Define el</text><text fill="#000000" font-family="'Helvetica'" font-size="18" font-weight="700" lengthAdjust="spacing" textLength="58.0166" x="133.7793" y="414.73">estado</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="186.126" x="191.7959" y="414.73">: Realizado, Pendiente,</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="333.7207" x="57.7363" y="432.73">En proceso o Cancelado + fecha y detalle</text><rect fill="#FFFFFF" height="38" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="276.0693" x="516.7529" y="165.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" font-weight="700" lengthAdjust="spacing" textLength="256.0693" x="526.7529" y="189.73">== REACTIVOS / INSUMOS ==</text><rect fill="#FFFFFF" height="56" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="373.1885" x="468.1934" y="225.3696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="353.1885" x="478.1934" y="249.23">Registra el insumo (nombre, codigo, unidad,</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="322.1104" x="478.1934" y="267.23">stock actual, stock minimo, vencimiento)</text><rect fill="#FFFFFF" height="56" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="346.1182" x="481.7285" y="316.3696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="92.0215" x="491.7285" y="340.23">Marca si es</text><text fill="#000000" font-family="'Helvetica'" font-size="18" font-weight="700" lengthAdjust="spacing" textLength="143.042" x="588.751" y="340.23">reactivo quimico</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="81.0527" x="736.7939" y="340.23">o requiere</text><text fill="#000000" font-family="'Helvetica'" font-size="18" font-weight="700" lengthAdjust="spacing" textLength="137.0479" x="491.7285" y="358.23">control especial</text><line style="stroke:#000000;stroke-width:1;" x1="15" x2="15" y1="81.8696" y2="677.3696"/><rect fill="#FFF3E0" height="595.5" style="stroke:#FFF3E0;stroke-width:1;" width="1005.4766" x="845.3818" y="81.8696"/><rect fill="#FFFFFF" height="56" rx="6" ry="6" style="stroke:#000000;stroke-width:2;" width="306.1631" x="851.3818" y="481.8696"/><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="286.1631" x="861.3818" y="505.73">Guarda el registro en la bitacora del</text><text fill="#000000" font-family="'Helvetica'" font-size="18" lengthAdjust="spacing" textLength="254.1621" x="861.3818" y="523.73">equipo y lo agrega a su historial</text><polygon fill="#FFFFFF" points="1420.4211,407.3696,1644.0061,407.3696,1656.0061,425.3696,1644.0061,443.3696,1420.4211,443.3696,1408.4211,425.3696,1420.4211,407.3696" style="stroke:#000000;stroke-width:2;stroke-linejoin:miter;stroke-mi